# Eureka overlay — pass with: python container.py start base --files docker-compose.eureka.yaml
# Mounts full IsaacLabEureka root into the container without rebuilding the image.
# IsaacLabEureka/IsaacLab lands at /workspace/isaaclab_eureka/IsaacLab — no conflict with /workspace/isaaclab.

services:
  isaac-lab-base:
    volumes:
      - type: bind
        source: ../../
        target: /workspace/isaaclab_eureka
